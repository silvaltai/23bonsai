<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dashboard · ALTY</title>
<meta name="description" content="Tu panel de control en ALTY."/>
<meta name="robots" content="noindex, nofollow"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:root{
  --font:'Geist',sans-serif;
  --rich-black:#02181A;
  --dark-green:#032221;
  --bangladesh:#03624C;
  --mountain:#2CC295;
  --caribbean:#00DF81;
  --anti-flash:#F1F7F6;
  --pine:#063028;
  --basil:#0B453A;
  --forest:#095544;
  --frog:#17876D;
  --mint:#2FA98C;
  --pistachio:#AACBC4;
}

body{
  background:var(--rich-black);
  color:var(--anti-flash);
  font-family:var(--font);
  min-height:100vh;
  line-height:1.5;
  overflow-x:hidden;
  position:relative;
}

/* ─── Fondo con orbs ─── */
.bg-layer{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  background:linear-gradient(180deg,#02181A 0%,#032221 50%,#03624C 100%);
}
.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(120px);
  opacity:.4;
  animation:float 18s ease-in-out infinite;
}
.orb-1{width:520px;height:520px;background:#00DF81;top:-100px;right:-150px;animation-delay:0s}
.orb-2{width:420px;height:420px;background:#2CC295;bottom:-80px;left:-100px;animation-delay:-6s}
.orb-3{width:300px;height:300px;background:#17876D;top:40%;left:30%;animation-delay:-12s;opacity:.25}

@keyframes float{
  0%,100%{transform:translate(0,0) scale(1)}
  33%{transform:translate(40px,-30px) scale(1.05)}
  66%{transform:translate(-30px,30px) scale(.95)}
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

/* ─── Header ─── */
.dh{
  position:sticky;top:0;z-index:50;
  padding:14px 20px;
  background:rgba(2,24,26,.6);
  backdrop-filter:blur(20px) saturate(140%);
  -webkit-backdrop-filter:blur(20px) saturate(140%);
  border-bottom:1px solid rgba(241,247,246,.06);
  display:flex;align-items:center;justify-content:space-between;
}
@media(min-width:768px){.dh{padding:16px 32px}}
.dh-logo{font-size:20px;font-weight:900;letter-spacing:-.04em;color:var(--anti-flash);text-decoration:none}
@media(min-width:768px){.dh-logo{font-size:22px}}

.dh-user{position:relative}
.dh-user-btn{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;
  background:rgba(241,247,246,.06);
  border:1px solid rgba(241,247,246,.1);
  border-radius:100px;
  color:var(--anti-flash);
  font-size:13px;font-weight:500;
  cursor:pointer;
  transition:background .2s,border-color .2s;
}
.dh-user-btn:hover{background:rgba(241,247,246,.1);border-color:rgba(241,247,246,.18)}
.dh-user-avatar{
  width:24px;height:24px;border-radius:50%;
  background:var(--caribbean);color:var(--rich-black);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:800;
  flex-shrink:0;
}
.dh-user-email{display:none}
@media(min-width:640px){.dh-user-email{display:inline;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.dh-user-chev{font-size:10px;opacity:.6;transition:transform .2s}
.dh-user.open .dh-user-chev{transform:rotate(180deg)}

.dh-menu{
  position:absolute;top:calc(100% + 8px);right:0;
  min-width:240px;
  background:rgba(2,24,26,.85);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(241,247,246,.1);
  border-radius:14px;
  padding:6px;
  opacity:0;visibility:hidden;transform:translateY(-8px);
  transition:all .2s;
}
.dh-user.open .dh-menu{opacity:1;visibility:visible;transform:translateY(0)}
.dh-menu-item{
  display:flex;align-items:center;gap:10px;
  width:100%;padding:10px 12px;
  background:transparent;border:none;
  color:var(--anti-flash);
  font-family:var(--font);font-size:14px;font-weight:500;
  text-align:left;cursor:pointer;
  border-radius:10px;
  transition:background .15s;
}
.dh-menu-item:hover{background:rgba(241,247,246,.08)}
.dh-menu-item-info{font-size:12px;color:rgba(241,247,246,.5);padding:8px 12px;border-bottom:1px solid rgba(241,247,246,.08);margin-bottom:4px;word-break:break-all}

/* ─── Main ─── */
.dm{
  flex:1;
  padding:32px 20px 60px;
  max-width:1100px;
  width:100%;
  margin:0 auto;
}
@media(min-width:768px){.dm{padding:48px 32px 80px}}

.greeting{
  margin-bottom:32px;
  animation:fadeUp .6s ease-out;
}
.greeting-eyebrow{
  font-size:12px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;
  color:var(--mountain);
  margin-bottom:8px;
}
.greeting-title{
  font-size:32px;font-weight:600;letter-spacing:-.03em;
  line-height:1.05;color:var(--anti-flash);
}
@media(min-width:768px){.greeting-title{font-size:44px}}
.greeting-sub{
  font-size:15px;color:rgba(241,247,246,.6);
  margin-top:8px;font-weight:500;
}

/* ─── Grid de cards ─── */
.cards{
  display:grid;
  grid-template-columns:1fr;
  gap:16px;
}
@media(min-width:768px){
  .cards{grid-template-columns:1fr 1fr;gap:20px}
  .card-wide{grid-column:1/-1}
}

/* ─── Liquid glass card base ─── */
.gcard{
  position:relative;
  background:linear-gradient(135deg,rgba(241,247,246,.08) 0%,rgba(241,247,246,.03) 100%);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(241,247,246,.1);
  border-radius:20px;
  padding:24px;
  overflow:hidden;
  animation:fadeUp .7s ease-out backwards;
}
.gcard::before{
  content:'';position:absolute;inset:0;
  border-radius:20px;
  background:linear-gradient(135deg,rgba(255,255,255,.08) 0%,transparent 50%);
  pointer-events:none;
}
@media(min-width:768px){.gcard{padding:28px}}
.gcard:nth-child(1){animation-delay:.1s}
.gcard:nth-child(2){animation-delay:.2s}
.gcard:nth-child(3){animation-delay:.3s}

.gcard-eyebrow{
  font-size:11px;font-weight:600;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--mountain);
  margin-bottom:12px;
  display:flex;align-items:center;gap:8px;
}
.gcard-eyebrow-dot{width:6px;height:6px;border-radius:50%;background:var(--caribbean);box-shadow:0 0 12px var(--caribbean)}

/* Plan card */
.plan-name{
  font-size:36px;font-weight:600;letter-spacing:-.03em;
  color:var(--anti-flash);line-height:1;
  margin-bottom:8px;
}
.plan-status{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:100px;
  font-size:12px;font-weight:600;
  background:rgba(0,223,129,.12);
  color:var(--caribbean);
  border:1px solid rgba(0,223,129,.25);
  margin-bottom:18px;
}
.plan-status.pending{background:rgba(255,193,7,.1);color:#ffd866;border-color:rgba(255,193,7,.25)}
.plan-status.failed{background:rgba(248,113,113,.1);color:#fca5a5;border-color:rgba(248,113,113,.25)}
.plan-status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.plan-desc{font-size:14px;color:rgba(241,247,246,.55);font-weight:500;line-height:1.55}

/* Orders card */
.orders-empty{
  text-align:center;
  padding:8px 0 4px;
}
.orders-empty-icon{
  width:56px;height:56px;border-radius:50%;
  background:rgba(0,223,129,.08);
  border:1px solid rgba(0,223,129,.18);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;
  font-size:22px;
}
.orders-empty-title{
  font-size:17px;font-weight:600;color:var(--anti-flash);
  margin-bottom:6px;letter-spacing:-.01em;
}
.orders-empty-desc{font-size:13.5px;color:rgba(241,247,246,.55);font-weight:500;margin-bottom:20px}
.orders-cta{
  display:inline-flex;align-items:center;gap:8px;
  padding:13px 22px;
  background:var(--caribbean);
  color:var(--rich-black);
  font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
  border:none;border-radius:100px;
  cursor:pointer;
  transition:transform .2s,box-shadow .2s;
  font-family:var(--font);
}
.orders-cta:hover{transform:translateY(-1px);box-shadow:0 12px 30px -8px rgba(0,223,129,.5)}
.orders-cta-arrow{transition:transform .2s}
.orders-cta:hover .orders-cta-arrow{transform:translateX(3px)}

/* Alert pendiente */
.alert{
  display:none;
  align-items:flex-start;gap:14px;
  padding:18px 20px;
  background:linear-gradient(135deg,rgba(255,193,7,.1) 0%,rgba(255,193,7,.04) 100%);
  border:1px solid rgba(255,193,7,.25);
  border-radius:16px;
  margin-bottom:20px;
  animation:fadeUp .6s ease-out;
}
.alert.show{display:flex}
.alert-icon{
  width:36px;height:36px;border-radius:50%;
  background:rgba(255,193,7,.15);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;font-size:18px;
}
.alert-content{flex:1}
.alert-title{font-size:14px;font-weight:600;color:#ffd866;margin-bottom:4px}
.alert-desc{font-size:13px;color:rgba(241,247,246,.7);font-weight:500;line-height:1.5}
.alert-action{
  display:inline-block;margin-top:10px;
  padding:8px 14px;
  background:#ffd866;color:var(--rich-black);
  font-size:12px;font-weight:700;
  border-radius:100px;border:none;
  cursor:pointer;font-family:var(--font);
}

/* Skeleton loader */
.skeleton{
  background:linear-gradient(90deg,rgba(241,247,246,.04) 0%,rgba(241,247,246,.1) 50%,rgba(241,247,246,.04) 100%);
  background-size:200% 100%;
  animation:shimmer 1.4s infinite;
  border-radius:8px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-line{height:14px;margin-bottom:10px;width:60%}
.sk-line.lg{height:36px;width:40%;margin-bottom:14px}
.sk-line.sm{height:12px;width:80%}
/* Toast notificación */
.toast{
  position:fixed;top:80px;right:20px;left:20px;
  max-width:420px;margin-left:auto;
  padding:14px 18px;
  background:linear-gradient(135deg,rgba(0,223,129,.95),rgba(44,194,149,.95));
  color:var(--rich-black);
  border-radius:14px;
  font-size:14px;font-weight:600;
  box-shadow:0 16px 40px -10px rgba(0,223,129,.5);
  display:flex;align-items:center;gap:12px;
  z-index:100;
  transform:translateY(-20px);opacity:0;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .3s;
}
.toast.show{transform:translateY(0);opacity:1}
.toast-icon{
  width:24px;height:24px;border-radius:50%;
  background:var(--rich-black);color:var(--caribbean);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:800;flex-shrink:0;
}

/* Lista de orders */
.orders-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.order-item{
  display:flex;align-items:center;gap:14px;
  padding:14px 16px;
  background:rgba(241,247,246,.04);
  border:1px solid rgba(241,247,246,.08);
  border-radius:12px;
  transition:background .2s;
}
.order-item:hover{background:rgba(241,247,246,.06)}
.order-status-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--caribbean);
  box-shadow:0 0 10px var(--caribbean);
  flex-shrink:0;
}
.order-status-dot.processing{background:#ffd866;box-shadow:0 0 10px #ffd866}
.order-status-dot.delivered{background:var(--mountain);box-shadow:none;opacity:.6}
.order-status-dot.failed{background:#fca5a5;box-shadow:0 0 10px #fca5a5}
.order-info{flex:1;min-width:0}
.order-product{font-size:13.5px;font-weight:600;color:var(--anti-flash);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.order-meta{font-size:12px;color:rgba(241,247,246,.5);font-weight:500}
.order-status{
  font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:4px 10px;border-radius:100px;
  background:rgba(0,223,129,.12);color:var(--caribbean);
  flex-shrink:0;
}
.order-status.processing{background:rgba(255,216,102,.12);color:#ffd866}
.order-status.delivered{background:rgba(241,247,246,.08);color:rgba(241,247,246,.7)}
.order-status.failed{background:rgba(248,113,113,.12);color:#fca5a5}

.orders-cta-add{
  display:inline-flex;align-items:center;gap:8px;
  margin-top:14px;padding:10px 16px;
  background:rgba(0,223,129,.1);
  color:var(--caribbean);
  font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  border:1px solid rgba(0,223,129,.25);
  border-radius:100px;cursor:pointer;
  transition:background .2s;
  font-family:var(--font);
}
.orders-cta-add:hover{background:rgba(0,223,129,.18)}
  
/* Mobile ≤380 */
@media(max-width:380px){
  .dm{padding:24px 16px 48px}
  .greeting-title{font-size:26px}
  .gcard{padding:20px;border-radius:16px}
  .plan-name{font-size:30px}
  .orders-cta{padding:12px 18px;font-size:12px}
}
</style>

<body>
<div class="toast" id="toast">
  <div class="toast-icon">✓</div>
  <span id="toastText">¡Pedido creado!</span>
</div>
  
<div class="bg-layer">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="app">

  <header class="dh">
    <a class="dh-logo" href="/">ALTY</a>
    <div class="dh-user" id="userMenu">
      <button class="dh-user-btn" id="userBtn" aria-expanded="false">
        <span class="dh-user-avatar" id="userAvatar">·</span>
        <span class="dh-user-email" id="userEmail">cargando...</span>
        <span class="dh-user-chev">▾</span>
      </button>
      <div class="dh-menu" role="menu">
        <div class="dh-menu-item-info" id="userMenuEmail">cargando...</div>
        <button class="dh-menu-item" id="logoutBtn">Cerrar sesión</button>
      </div>
    </div>
  </header>

  <main class="dm">

    <div class="greeting">
      <div class="greeting-eyebrow">Tu panel</div>
      <h1 class="greeting-title">Hola, <span id="greetingName">...</span></h1>
      <p class="greeting-sub">Aquí controlas tus pedidos y tu plan.</p>
    </div>

    <div class="alert" id="paymentAlert">
      <div class="alert-icon">!</div>
      <div class="alert-content">
        <div class="alert-title">Tu pago está pendiente</div>
        <div class="alert-desc">Completa el pago para activar tu plan y empezar a usar ALTY.</div>
        <button class="alert-action" id="retryPaymentBtn">Reintentar pago →</button>
      </div>
    </div>

    <div class="cards">

      <div class="gcard" id="planCard">
        <div class="gcard-eyebrow">
          <span class="gcard-eyebrow-dot"></span>
          Tu plan actual
        </div>
        <div class="sk-line lg skeleton"></div>
        <div class="sk-line sm skeleton"></div>
      </div>

      <div class="gcard card-wide" id="ordersCard">
        <div class="gcard-eyebrow">
          <span class="gcard-eyebrow-dot"></span>
          Tus pedidos
        </div>
        <div class="orders-empty" id="ordersEmpty">
          <div class="orders-empty-icon" onclick="window.location.href='/nuevo-pedido'" style="cursor:pointer">+</div>
          <div class="orders-empty-title">Aún no tienes pedidos</div>
          <div class="orders-empty-desc">Crea tu primer pedido y recíbelo en menos de 24 horas.</div>
          <button class="orders-cta" id="newOrderBtn">
            Crear mi primer pedido
            <span class="orders-cta-arrow">→</span>
          </button>
        </div>
      </div>

    </div>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
const SUPABASE_URL = "https://glskfwhetombxkrjfrjl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdsc2tmd2hldG9tYnhrcmpmcmpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwNzc1MjEsImV4cCI6MjA5MzY1MzUyMX0.cC2hg9BdeTJBHizUlduUb1vcPs0OV7IFZoEjArNE_j8";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const PLAN_LABELS = {
  free:'Plan Gratis',
  starter:'Starter',
  growth:'Growth',
  scale:'Scale'
};
const PLAN_DESCRIPTIONS = {
  free:'Tu plan permite 1 producto único. Entrega en menos de 24 horas.',
  starter:'Hasta 5 productos mensuales y mucho más.',
  growth:'15 productos al mes, tienda Shopify incluida y datos validados.',
  scale:'30 productos al mes con equipo completo y soporte prioritario.'
};
const STATUS_LABELS = {
  active:'Activo',
  pending_payment:'Pago pendiente',
  paid:'Pagado',
  failed:'Fallido',
  refunded:'Reembolsado'
};

// ── Proteger ruta: sin sesión → /login ──
async function init(){
  const { data:{ session } } = await supa.auth.getSession();
  if(!session){
    window.location.href='/login';
    return;
  }
  await loadProfile(session.user);
}

async function loadProfile(authUser){
  const { data:profile, error } = await supa
    .from('profiles')
    .select('*')
    .eq('id', authUser.id)
    .single();

  if(error || !profile){
    document.getElementById('greetingName').textContent='allá';
    document.getElementById('userEmail').textContent=authUser.email;
    document.getElementById('userMenuEmail').textContent=authUser.email;
    document.getElementById('userAvatar').textContent=(authUser.email||'?')[0].toUpperCase();
    return;
  }

  // Header
  const email=profile.email||authUser.email;
  document.getElementById('userEmail').textContent=email;
  document.getElementById('userMenuEmail').textContent=email;
  document.getElementById('userAvatar').textContent=email[0].toUpperCase();

  // Greeting (parte antes del @)
  const namePart=email.split('@')[0];
  document.getElementById('greetingName').textContent=namePart;

  // Plan card
  renderPlanCard(profile);

// Alert pago pendiente
  if(profile.status==='pending_payment'){
    document.getElementById('paymentAlert').classList.add('show');
  }

  // Cargar lista de orders
  await loadOrders();

  // Toast si viene de crear pedido
  const params = new URLSearchParams(window.location.search);
  if(params.get('new_order') === '1'){
    showToast('¡Pedido creado! Lo verás procesándose en las próximas horas.');
    // Limpiar query param sin recargar
    window.history.replaceState({}, '', '/dashboard');
  }
}

const STATUS_BADGES = {
  paid: { label:'En cola', cls:'' },
  scraping: { label:'Procesando', cls:'processing' },
  generating_video: { label:'Generando videos', cls:'processing' },
  editing: { label:'Editando', cls:'processing' },
  delivering: { label:'Subiendo a Shopify', cls:'processing' },
  delivered: { label:'Entregado', cls:'delivered' },
  failed: { label:'Falló', cls:'failed' },
  refunded: { label:'Reembolsado', cls:'delivered' },
  pending_payment: { label:'Pago pendiente', cls:'processing' }
};

async function loadOrders(){
  const { data:orders, error } = await supa
    .from('orders')
    .select('id,product_url,status,created_at,plan')
    .order('created_at', { ascending:false })
    .limit(10);

  if(error){
    return;
  }

  if(!orders || orders.length === 0){
    return; // Mantiene el estado "Aún no tienes pedidos"
  }

  // Reemplazar contenido de la card de orders
  const ordersCard = document.getElementById('ordersCard');
  ordersCard.innerHTML = `
    <div class="gcard-eyebrow"><span class="gcard-eyebrow-dot"></span>Tus pedidos</div>
    <div class="orders-list" id="ordersList"></div>
    <button class="orders-cta-add" onclick="window.location.href='/nuevo-pedido'">
      + Crear otro pedido
    </button>
  `;

  const list = document.getElementById('ordersList');
  orders.forEach(order=>{
    const badge = STATUS_BADGES[order.status] || { label:order.status, cls:'' };
    const productHost = (()=>{ try{ return new URL(order.product_url).hostname.replace('www.',''); }catch{ return 'producto'; } })();
    const date = new Date(order.created_at).toLocaleDateString('es-CL',{day:'numeric',month:'short'});

    const item = document.createElement('div');
    item.className = 'order-item';
    item.innerHTML = `
      <div class="order-status-dot ${badge.cls}"></div>
      <div class="order-info">
        <div class="order-product">${productHost}</div>
        <div class="order-meta">Creado el ${date}</div>
      </div>
      <div class="order-status ${badge.cls}">${badge.label}</div>
    `;
    list.appendChild(item);
  });
}

function showToast(msg){
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = msg;
  toast.classList.add('show');
  setTimeout(()=>toast.classList.remove('show'), 4500);
}

function renderPlanCard(profile){
  const planLabel=PLAN_LABELS[profile.plan]||profile.plan;
  const statusLabel=STATUS_LABELS[profile.status]||profile.status;
  const desc=PLAN_DESCRIPTIONS[profile.plan]||'';

  let statusClass='';
  if(profile.status==='pending_payment') statusClass='pending';
  else if(profile.status==='failed') statusClass='failed';

  document.getElementById('planCard').innerHTML=`
    <div class="gcard-eyebrow"><span class="gcard-eyebrow-dot"></span>Tu plan actual</div>
    <div class="plan-name">${planLabel}</div>
    <div class="plan-status ${statusClass}"><span class="plan-status-dot"></span>${statusLabel}</div>
    <div class="plan-desc">${desc}</div>
  `;
}

// ── Menú usuario ──
const userMenu=document.getElementById('userMenu');
const userBtn=document.getElementById('userBtn');
userBtn.addEventListener('click',(e)=>{
  e.stopPropagation();
  const open=userMenu.classList.toggle('open');
  userBtn.setAttribute('aria-expanded',String(open));
});
document.addEventListener('click',()=>{
  userMenu.classList.remove('open');
  userBtn.setAttribute('aria-expanded','false');
});

// ── Logout ──
document.getElementById('logoutBtn').addEventListener('click',async()=>{
  await supa.auth.signOut();
  window.location.href='/';
});

// ── Crear pedido ──
document.getElementById('newOrderBtn').addEventListener('click',()=>{
  window.location.href = '/nuevo-pedido';
});

// ── Reintentar pago (placeholder) ──
document.getElementById('retryPaymentBtn').addEventListener('click',()=>{
  alert('Próximamente podrás reintentar tu pago desde aquí.');
});

init();
</script>
